<!DOCTYPE html>
<html>
<head>
    <title>Task List - Toggle Dark/Light Mode</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* ✅ Theme Variables */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --link-color: #0d6efd;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --link-color: #4dabf7;
        }

        /* ✅ Apply variables */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .list-group-item {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .list-group-item strong {
            color: var(--link-color);
        }

        .alert {
            background-color: var(--card-bg);
            border-color: var(--link-color);
            color: var(--link-color);
        }

        /* ✅ Toggle Button */
        .theme-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }
    </style>
</head>
<body class="container mt-5">
    <!-- ✅ Dark/Light Toggle Button -->
    <button class="btn btn-secondary theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>

    <h1 class="mb-4">Tasks</h1>

    {% if request.GET.completed %}
        <div class="alert alert-success text-center" role="alert">
            <h4 class="mb-3">🎉 Task marked as completed! 🎉</h4>
            <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Happy Cat" style="max-width: 300px; border-radius: 10px;">
        </div>
    {% endif %}

    <ul class="list-group mb-4">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ task.title }}</strong> - {{ task.status }} - Due: {{ task.due_date }}
                </div>
                <div class="btn-group">
                    <form method="post" action="/update-status/{{ task.id }}/">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-primary">
                            {% if task.status == "Pending" %} Mark as Completed {% else %} Mark as Pending {% endif %}
                        </button>
                    </form>

                    <form method="post" action="/delete/{{ task.id }}/" style="margin-left: 5px;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>

    <a href="/add/" class="btn btn-success">Add Task</a>

    <audio id="completedSound">
        <source src="https://www.myinstants.com/media/sounds/wow-sound-effect.mp3" type="audio/mpeg">
    </audio>

    <audio id="pendingSound">
        <source src="https://www.myinstants.com/media/sounds/youcandoit.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ✅ Toggle Theme and Save Preference
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const btn = document.querySelector(".theme-toggle-btn");
            if (document.body.classList.contains("dark-mode")) {
                btn.textContent = "☀️ Light Mode";
                localStorage.setItem("theme", "dark");
            } else {
                btn.textContent = "🌙 Dark Mode";
                localStorage.setItem("theme", "light");
            }
        }

        // ✅ Load Saved Theme Preference
        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
                document.querySelector(".theme-toggle-btn").textContent = "☀️ Light Mode";
            }

            // Play sound based on status
            const params = new URLSearchParams(window.location.search);
            const completedSound = document.getElementById("completedSound");
            const pendingSound = document.getElementById("pendingSound");

            const status = params.get("status");
            if (status === "Completed") {
                completedSound.play();
            } else if (status === "Pending") {
                pendingSound.play();
            }
        });
    </script>
</body>
</html>
