<!DOCTYPE html>
<html>
<head>
    <title>Task List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Tasks</h1>

    <!-- ✅ Completed Alert -->
    {% if request.GET.completed %}
        <div class="alert alert-success text-center" role="alert">
            <h4 class="mb-3">🎉 Task marked as completed! 🎉</h4>
            <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Happy Cat" style="max-width: 300px; border-radius: 10px;">
        </div>
    {% endif %}

    <!-- ✅ Task List -->
    <ul class="list-group mb-4">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ task.title }}</strong> - {{ task.status }} - Due: {{ task.due_date }}
                </div>
                <div class="btn-group">
                    <!-- Toggle Status Form -->
                    <form method="post" action="/update-status/{{ task.id }}/">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-primary">
                            {% if task.status == "Pending" %} Mark as Completed {% else %} Mark as Pending {% endif %}
                        </button>
                    </form>

                    <!-- Delete Form -->
                    <form method="post" action="/delete/{{ task.id }}/" style="margin-left: 5px;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>

    <a href="/add/" class="btn btn-success">Add Task</a>

    <!-- ✅ Audio Elements -->
    <audio id="completedSound">
        <source src="https://www.myinstants.com/media/sounds/wow-sound-effect.mp3" type="audio/mpeg">
    </audio>

    <audio id="pendingSound">
        <source src="https://www.myinstants.com/media/sounds/youcandoit.mp3" type="audio/mpeg">
    </audio>

    <!-- ✅ JavaScript for Playing Sound Based on Status -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const completedSound = document.getElementById("completedSound");
            const pendingSound = document.getElementById("pendingSound");

            const status = params.get("status");
            if (status === "Completed") {
                completedSound.play();
            } else if (status === "Pending") {
                pendingSound.play();
            }
        });
    </script>
</body>
</html>
